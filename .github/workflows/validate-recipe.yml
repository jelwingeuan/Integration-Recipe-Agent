name: Validate integration recipe

on:
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: startsWith(github.head_ref, 'recipe/issue-') && contains(github.event.pull_request.labels.*.name, 'recipe-reviewed')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - id: recipe
        run: node scripts/find-recipe.mjs
      - name: Install without lifecycle scripts
        working-directory: ${{ steps.recipe.outputs.recipe_dir }}
        run: npm ci --ignore-scripts
      - name: Build
        working-directory: ${{ steps.recipe.outputs.recipe_dir }}
        run: npm run build
      - name: Record build status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_RESULT: ${{ job.status }}
        run: |
          if [ "$BUILD_RESULT" = "success" ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label awaiting-sandbox
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label build-failed || true
          else
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label build-failed
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label ready || true
          fi

  live-sandbox:
    needs: build
    if: contains(github.event.pull_request.labels.*.name, 'sandbox-approved')
    runs-on: ubuntu-latest
    environment: recipe-sandbox
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - id: recipe
        run: node scripts/find-recipe.mjs
      - name: Install without lifecycle scripts
        working-directory: ${{ steps.recipe.outputs.recipe_dir }}
        run: npm ci --ignore-scripts
      - name: Run reviewed sandbox smoke test
        working-directory: ${{ steps.recipe.outputs.recipe_dir }}
        env:
          PARTNER_API_BASE_URL: ${{ vars.PARTNER_API_BASE_URL }}
          PARTNER_SANDBOX_API_KEY: ${{ secrets.PARTNER_SANDBOX_API_KEY }}
        run: npm run smoke
      - name: Record live status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LIVE_RESULT: ${{ job.status }}
        run: |
          if [ "$LIVE_RESULT" = "success" ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label ready
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label awaiting-sandbox || true
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label build-failed || true
          else
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label build-failed
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label ready || true
          fi
