name: Generate integration recipe

on:
  issues:
    types: [labeled]

concurrency:
  group: recipe-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.label.name == 'generate-recipe'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      issue_number: ${{ steps.prepare.outputs.issue_number }}
      recipe_glob: ${{ steps.prepare.outputs.recipe_glob }}
      error: ${{ steps.prepare.outputs.error }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: prepare
        run: node scripts/prepare-context.mjs
      - if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recipe-context-${{ github.event.issue.number }}
          path: .recipe-context/
          include-hidden-files: true
          retention-days: 1

  needs-input:
    needs: prepare
    if: needs.prepare.outputs.ready != 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ERROR_MESSAGE: ${{ needs.prepare.outputs.error }}
        run: |
          gh label create needs-input --repo "$GITHUB_REPOSITORY" --color D93F0B --force
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label needs-input
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Recipe status: **needs-input**. ${ERROR_MESSAGE}"

  generate:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: recipe-context-${{ github.event.issue.number }}
          path: .recipe-context
      - name: Run Codex without repository or sandbox credentials
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/generate-recipe.md
          output-file: .recipe-context/codex-output.md
          sandbox: workspace-write
          codex-args: '["--ephemeral"]'
      - uses: actions/upload-artifact@v4
        with:
          name: generated-recipe-${{ github.event.issue.number }}
          path: ${{ needs.prepare.outputs.recipe_glob }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, generate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: generated-recipe-${{ github.event.issue.number }}
          path: incoming
      # Keep this validation on the trusted default-branch checkout. Generated
      # PR branches are never allowed to supply the validator itself.
      - id: accept
        run: node scripts/accept-artifact.mjs incoming "${{ needs.prepare.outputs.issue_number }}"
      - name: Create or update draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          RECIPE_DIR: ${{ steps.accept.outputs.recipe_dir }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="recipe/issue-${ISSUE_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A recipes
          git commit --allow-empty -m "Generate recipe for issue #${ISSUE_NUMBER}"
          git push --force origin "HEAD:refs/heads/${branch}"

          gh label create generated --repo "$GITHUB_REPOSITORY" --color 1D76DB --force
          gh label create awaiting-sandbox --repo "$GITHUB_REPOSITORY" --color FBCA04 --force
          gh label create recipe-reviewed --repo "$GITHUB_REPOSITORY" --color 5319E7 --force
          gh label create sandbox-approved --repo "$GITHUB_REPOSITORY" --color 0E8A16 --force
          gh label create build-failed --repo "$GITHUB_REPOSITORY" --color B60205 --force
          gh label create ready --repo "$GITHUB_REPOSITORY" --color 0E8A16 --force

          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number')"
          title="Recipe for #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          body="Generated for #${ISSUE_NUMBER}.\n\nStatus: **generated**. Review every file, then apply \`recipe-reviewed\`. Apply \`sandbox-approved\` only after review."
          if [ -z "$pr_number" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --head "$branch" --base "$DEFAULT_BRANCH" --title "$title" --body "$body"
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number')"
          else
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
          gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --add-label generated --add-label awaiting-sandbox
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Recipe status: **generated** in PR #${pr_number} at \`${RECIPE_DIR}\`."
