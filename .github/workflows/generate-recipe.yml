name: Generate integration recipe

on:
  issues:
    types: [labeled]

concurrency:
  group: recipe-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.label.name == 'generate-recipe'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      issue_number: ${{ steps.prepare.outputs.issue_number }}
      recipe_glob: ${{ steps.prepare.outputs.recipe_glob }}
      error: ${{ steps.prepare.outputs.error }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: prepare
        run: node scripts/prepare-context.mjs
      - if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recipe-context-${{ github.event.issue.number }}
          path: .recipe-context/
          include-hidden-files: true
          retention-days: 1

  needs-input:
    needs: prepare
    if: needs.prepare.outputs.ready != 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ERROR_MESSAGE: ${{ needs.prepare.outputs.error }}
        run: |
          gh label create needs-input --repo "$GITHUB_REPOSITORY" --color D93F0B --force
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label needs-input
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Recipe status: **needs-input**. ${ERROR_MESSAGE}"

  generate:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: recipe-context-${{ github.event.issue.number }}
          path: .recipe-context
      - name: Run Codex without repository or sandbox credentials
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/generate-recipe.md
          output-file: .recipe-context/codex-output.md
          sandbox: workspace-write
          codex-args: '["--ephemeral"]'
      - uses: actions/upload-artifact@v4
        with:
          name: generated-recipe-${{ github.event.issue.number }}
          path: ${{ needs.prepare.outputs.recipe_glob }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  validate-artifact:
    needs: [prepare, generate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      recipe_dir: ${{ steps.accept.outputs.recipe_dir }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: generated-recipe-${{ github.event.issue.number }}
          path: incoming
      # Keep this validation on the trusted default-branch checkout. Generated
      # PR branches are never allowed to supply the validator itself.
      - id: accept
        run: node scripts/accept-artifact.mjs incoming "${{ needs.prepare.outputs.issue_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-recipe-${{ github.event.issue.number }}
          path: ${{ steps.accept.outputs.recipe_dir }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, validate-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: accepted-recipe-${{ github.event.issue.number }}
          path: ${{ needs.validate-artifact.outputs.recipe_dir }}
      - name: Commit accepted recipe without checking out the repository
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          RECIPE_DIR: ${{ needs.validate-artifact.outputs.recipe_dir }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from "node:fs/promises";
          import path from "node:path";

          const { GITHUB_REPOSITORY: repo, GITHUB_SHA: baseSha, GH_TOKEN: token, ISSUE_NUMBER: rawIssue, RECIPE_DIR: recipeDir } = process.env;
          const issue = Number(rawIssue);
          if (!Number.isSafeInteger(issue) || issue < 1 || !new RegExp(`^recipes/${issue}-[a-z0-9][a-z0-9-]*$`).test(recipeDir)) {
            throw new Error("Invalid accepted recipe path.");
          }

          async function api(method, route, body, allowMissing = false) {
            const response = await fetch(`https://api.github.com/repos/${repo}/git/${route}`, {
              method,
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
                ...(body ? { "Content-Type": "application/json" } : {}),
              },
              body: body ? JSON.stringify(body) : undefined,
              signal: AbortSignal.timeout(30_000),
            });
            if (allowMissing && response.status === 404) return null;
            if (!response.ok) throw new Error(`${method} ${route} failed: HTTP ${response.status}`);
            return response.json();
          }

          async function filesIn(directory) {
            const files = [];
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const name = path.posix.join(directory, entry.name);
              if (entry.isDirectory()) files.push(...await filesIn(name));
              else if (entry.isFile()) files.push(name);
              else throw new Error(`Unsupported accepted recipe entry: ${name}`);
            }
            return files;
          }

          const commit = await api("GET", `commits/${baseSha}`);
          const baseTree = await api("GET", `trees/${commit.tree.sha}?recursive=1`);
          if (baseTree.truncated) throw new Error("Base tree is truncated; cannot safely replace the recipe.");
          const files = await filesIn(recipeDir);
          if (!files.length) throw new Error("Accepted recipe artifact is empty.");
          const newPaths = new Set(files);
          const tree = baseTree.tree
            .filter((entry) => entry.path.startsWith(`recipes/${issue}-`) && entry.type !== "tree" && !newPaths.has(entry.path))
            .map(({ path, mode, type }) => ({ path, mode, type, sha: null }));
          for (const file of files) {
            const content = (await readFile(file)).toString("base64");
            const blob = await api("POST", "blobs", { content, encoding: "base64" });
            tree.push({ path: file, mode: "100644", type: "blob", sha: blob.sha });
          }
          const nextTree = await api("POST", "trees", { base_tree: commit.tree.sha, tree });
          const author = { name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com" };
          const nextCommit = await api("POST", "commits", {
            message: `Generate recipe for issue #${issue}`,
            tree: nextTree.sha,
            parents: [baseSha],
            author,
            committer: author,
          });
          const ref = `heads/recipe/issue-${issue}`;
          if (await api("GET", `ref/${ref}`, undefined, true)) {
            await api("PATCH", `refs/${ref}`, { sha: nextCommit.sha, force: true });
          } else {
            await api("POST", "refs", { ref: `refs/${ref}`, sha: nextCommit.sha });
          }
          NODE
      - name: Create or update draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          RECIPE_DIR: ${{ needs.validate-artifact.outputs.recipe_dir }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="recipe/issue-${ISSUE_NUMBER}"
          gh label create generated --repo "$GITHUB_REPOSITORY" --color 1D76DB --force
          gh label create awaiting-sandbox --repo "$GITHUB_REPOSITORY" --color FBCA04 --force
          gh label create recipe-reviewed --repo "$GITHUB_REPOSITORY" --color 5319E7 --force
          gh label create sandbox-approved --repo "$GITHUB_REPOSITORY" --color 0E8A16 --force
          gh label create build-failed --repo "$GITHUB_REPOSITORY" --color B60205 --force
          gh label create ready --repo "$GITHUB_REPOSITORY" --color 0E8A16 --force

          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number')"
          title="Recipe for #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          body="Generated for #${ISSUE_NUMBER}.\n\nStatus: **generated**. Review every file, then apply \`recipe-reviewed\`. Apply \`sandbox-approved\` only after review."
          if [ -z "$pr_number" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --head "$branch" --base "$DEFAULT_BRANCH" --title "$title" --body "$body"
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number')"
          else
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
          gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --add-label generated --add-label awaiting-sandbox
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Recipe status: **generated** in PR #${pr_number} at \`${RECIPE_DIR}\`."
